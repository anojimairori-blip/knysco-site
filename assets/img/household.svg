<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg-hou" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D6A4F"/>
      <stop offset="100%" stop-color="#1B4332"/>
    </linearGradient>
    <linearGradient id="sky-hou" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#D4B87A" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#D4B87A" stop-opacity="0"/>
    </linearGradient>
    <pattern id="leaves" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 20 15 Q 25 20 20 25 Q 15 20 20 15" fill="rgba(255,255,255,0.03)"/>
    </pattern>
  </defs>

  <rect width="600" height="400" fill="url(#bg-hou)"/>
  <rect width="600" height="400" fill="url(#sky-hou)"/>
  <rect width="600" height="400" fill="url(#leaves)"/>

  <!-- 太陽/月 -->
  <circle cx="500" cy="90" r="35" fill="#D4B87A" opacity="0.4"/>
  <circle cx="500" cy="90" r="25" fill="#D4B87A" opacity="0.3"/>

  <!-- 家 -->
  <g transform="translate(180, 130)">
    <!-- 屋根 -->
    <path d="M 100 0 L 0 90 L 30 90 L 30 180 L 170 180 L 170 90 L 200 90 Z" fill="#B08D57"/>
    <path d="M 100 0 L 0 90 L 200 90 Z" fill="#8b6d3f"/>

    <!-- 家本体 -->
    <rect x="30" y="90" width="140" height="90" fill="#f5efe2"/>
    <rect x="30" y="90" width="140" height="90" fill="none" stroke="rgba(0,0,0,0.15)" stroke-width="1"/>

    <!-- ドア -->
    <rect x="85" y="130" width="30" height="50" fill="#8b6d3f"/>
    <circle cx="108" cy="155" r="1.5" fill="#B08D57"/>

    <!-- 窓 -->
    <rect x="45" y="105" width="25" height="20" fill="#A8DADC" stroke="rgba(0,0,0,0.2)" stroke-width="1"/>
    <line x1="57.5" y1="105" x2="57.5" y2="125" stroke="rgba(0,0,0,0.2)" stroke-width="1"/>
    <line x1="45" y1="115" x2="70" y2="115" stroke="rgba(0,0,0,0.2)" stroke-width="1"/>

    <rect x="130" y="105" width="25" height="20" fill="#A8DADC" stroke="rgba(0,0,0,0.2)" stroke-width="1"/>
    <line x1="142.5" y1="105" x2="142.5" y2="125" stroke="rgba(0,0,0,0.2)" stroke-width="1"/>
    <line x1="130" y1="115" x2="155" y2="115" stroke="rgba(0,0,0,0.2)" stroke-width="1"/>

    <!-- 煙突 -->
    <rect x="130" y="20" width="15" height="40" fill="#8b6d3f"/>
    <rect x="128" y="18" width="19" height="6" fill="#B08D57"/>
  </g>

  <!-- 段ボール（家の左） -->
  <g transform="translate(60, 260)">
    <!-- 大きい段ボール -->
    <rect x="0" y="0" width="70" height="55" fill="#D4B87A" stroke="#8b6d3f" stroke-width="1"/>
    <line x1="0" y1="10" x2="70" y2="10" stroke="rgba(0,0,0,0.2)" stroke-width="1"/>
    <line x1="35" y1="10" x2="35" y2="0" stroke="rgba(0,0,0,0.2)" stroke-width="1"/>
    <text x="35" y="35" text-anchor="middle" fill="rgba(0,0,0,0.35)" font-family="Noto Sans JP, sans-serif" font-size="10" font-weight="bold">思い出</text>

    <!-- 中くらいの段ボール -->
    <rect x="15" y="-30" width="45" height="30" fill="#B08D57" stroke="#8b6d3f" stroke-width="1"/>
    <line x1="15" y1="-25" x2="60" y2="-25" stroke="rgba(0,0,0,0.2)" stroke-width="1"/>
  </g>

  <!-- 家具（家の右） -->
  <g transform="translate(410, 240)">
    <!-- 椅子 -->
    <rect x="0" y="30" width="35" height="4" fill="#8b6d3f"/>
    <rect x="3" y="34" width="4" height="25" fill="#8b6d3f"/>
    <rect x="28" y="34" width="4" height="25" fill="#8b6d3f"/>
    <rect x="3" y="0" width="4" height="30" fill="#B08D57"/>
    <rect x="7" y="8" width="20" height="20" fill="#B08D57" opacity="0.6"/>

    <!-- ランプ -->
    <g transform="translate(55, -10)">
      <path d="M 0 20 L -10 40 L 10 40 Z" fill="#D4B87A" opacity="0.8"/>
      <rect x="-1" y="40" width="2" height="20" fill="#8b6d3f"/>
      <rect x="-8" y="60" width="16" height="3" fill="#8b6d3f"/>
    </g>
  </g>

  <!-- 落ち葉/雑草 -->
  <g fill="rgba(255,255,255,0.3)">
    <path d="M 350 340 Q 360 335 370 340 Q 360 345 350 340" />
    <path d="M 380 350 Q 390 345 400 350 Q 390 355 380 350" />
    <path d="M 130 350 Q 140 345 150 350 Q 140 355 130 350" />
  </g>

  <!-- 地面 -->
  <path d="M 0 320 L 600 320 L 600 400 L 0 400 Z" fill="rgba(0,0,0,0.15)"/>

  <!-- ラベル -->
  <text x="300" y="60" text-anchor="middle" fill="#D4B87A" font-family="Barlow, sans-serif" font-size="14" font-weight="700" letter-spacing="0.3em">HOUSEHOLD</text>
  <text x="300" y="380" text-anchor="middle" fill="rgba(255,255,255,0.7)" font-family="Noto Sans JP, sans-serif" font-size="12">家庭系不用品回収・遺品整理（秘密厳守）</text>
</svg>
